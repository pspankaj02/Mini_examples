# ==============================================================================================
# KiranaHub Cloud-Native: Production Nginx Reverse Proxy & SPA Router Configuration
# [KYA KARTA HAI] SPA routing, Gzip compression, and security headers configure karta hai.
# [KYU ZAROORI HAI] Client-side React Router ke paths refresh karne par 404 error na aaye.
# [KAISE CHALTA HAI] try_files directive file search karti hai, fail hone par index.html par fallback karti hai.
# [OUTPUT / SIDE EFFECT] Fast, zero-crash static web asset delivery.
# [VARIATIONS TO TRY] Micro-caching headers aur Content Security Policy (CSP) headers add karein.
# ==============================================================================================

# [KYA KARTA HAI] Virtual host server block initialize karta hai.
# [KYU ZAROORI HAI] Port binding aur domain routing rules group karta hai.
# [KAISE CHALTA HAI] Nginx master process server block context parse karta hai.
# [OUTPUT / SIDE EFFECT] Server context established.
# [VARIATIONS TO TRY] Multiple server blocks for subdomains.
server {
    # [KYA KARTA HAI] Non-root unprivileged port 8080 par listen karta hai.
    # [KYU ZAROORI HAI] Container security compliance without root privileges.
    # [KAISE CHALTA HAI] Socket listen call binds port 8080.
    # [OUTPUT / SIDE EFFECT] Port 8080 active.
    # [VARIATIONS TO TRY] Add `reuseport` directive for multi-worker scaling.
    listen 8080;

    # [KYA KARTA HAI] Server name wildcard match configure karta hai.
    # [KYU ZAROORI HAI] Har host header request accept karta hai Kubernetes cluster me.
    # [KAISE CHALTA HAI] Host header check skips specific hostname matching.
    # [OUTPUT / SIDE EFFECT] Matches any domain/IP.
    # [VARIATIONS TO TRY] Specific production domain `kiranahub.internal`.
    server_name _;

    # [KYA KARTA HAI] Static assets serve karne ka root directory set karta hai.
    # [KYU ZAROORI HAI] Nginx file lookup base path locate karta hai.
    # [KAISE CHALTA HAI] URI path ko `/usr/share/nginx/html` ke relative resolve karta hai.
    # [OUTPUT / SIDE EFFECT] Document root defined.
    # [VARIATIONS TO TRY] Separate directory for uploaded user assets.
    root /usr/share/nginx/html;

    # [KYA KARTA HAI] Default landing page filename define karta hai.
    # [KYU ZAROORI HAI] Root request aane par browser ko HTML deliver karna.
    # [KAISE CHALTA HAI] `/` request aane par `index.html` look up karta hai.
    # [OUTPUT / SIDE EFFECT] index.html served.
    # [VARIATIONS TO TRY] Custom maintenance.html fallback.
    index index.html;

    # [KYA KARTA HAI] Real-time text response Gzip compression enable karta hai.
    # [KYU ZAROORI HAI] Network payload size 70% reduce karta hai faster 10-minute delivery app loading ke liye.
    # [KAISE CHALTA HAI] Nginx dynamically static files ko gzip stream me compress karta hai.
    # [OUTPUT / SIDE EFFECT] Reduced bandwidth usage.
    # [VARIATIONS TO TRY] Brotli compression for higher ratio.
    gzip on;

    # [KYA KARTA HAI] Gzip compression ke eligible MIME types declare karta hai.
    # [KYU ZAROORI HAI] Image files ko dubara compress karne se CPU waste hota hai; sirf text/code compress hona chahiye.
    # [KAISE CHALTA HAI] Content-Type match hone par hi compression trigger hota hai.
    # [OUTPUT / SIDE EFFECT] CSS, JS, JSON, XML compressed.
    # [VARIATIONS TO TRY] Add `application/wasm` for WebAssembly.
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # [KYA KARTA HAI] Root URI location routing block define karta hai.
    # [KYU ZAROORI HAI] Sabhi incoming web requests ke file lookup rules specify karne ke liye.
    # [KAISE CHALTA HAI] Prefix match `/` matches all URL paths.
    # [OUTPUT / SIDE EFFECT] Location context open.
    # [VARIATIONS TO TRY] Custom sub-path location blocks `/catalog/`.
    location / {
        # [KYA KARTA HAI] File system me pehle URI check karta hai, fir directory, fir index.html serve karta hai.
        # [KYU ZAROORI HAI] React Router routes (e.g. `/cart` ya `/order/123`) par refresh dabane par 404 aane se rokta hai.
        # [KAISE CHALTA HAI] Agar requested file nahi milti toh fallback me index.html stream karta hai.
        # [OUTPUT / SIDE EFFECT] SPA client-side navigation seamlessly works on refresh.
        # [VARIATIONS TO TRY] Custom 404 page for missing API assets.
        try_files $uri $uri/ /index.html;
    }

    # [KYA KARTA HAI] Static assets (JS/CSS/Images) ke liye immutable long-term caching configure karta hai.
    # [KYU ZAROORI HAI] Cache-busting hash wale files ko browser cache me 1 saal tak save karta hai zero re-download ke liye.
    # [KAISE CHALTA HAI] Extension match hote hi Cache-Control header inject hota hai.
    # [OUTPUT / SIDE EFFECT] Instant page reload for returning customers.
    # [VARIATIONS TO TRY] Add public proxy caching headers.
    location ~* \.(?:css|js|jpg|jpeg|gif|png|ico|svg|woff2?)$ {
        # [KYA KARTA HAI] Cache expiry 1 year set karta hai.
        # [KYU ZAROORI HAI] Maximum browser caching without revalidation.
        # [KAISE CHALTA HAI] Sets Expire HTTP response headers.
        # [OUTPUT / SIDE EFFECT] Max-age set to 1y.
        # [VARIATIONS TO TRY] 30 days for less frequently updated assets.
        expires 1y;

        # [KYA KARTA HAI] Immutable cache header add karta hai.
        # [KYU ZAROORI HAI] Browser ko batata hai ki yeh file kabhi modify nahi hogi (content-hash in filename).
        # [KAISE CHALTA HAI] Cache-Control response header appended.
        # [OUTPUT / SIDE EFFECT] Zero 304 revalidation round-trips.
        # [VARIATIONS TO TRY] Private cache for user-specific avatars.
        add_header Cache-Control "public, immutable";
    }

    # [KYA KARTA HAI] Kubernetes liveness and readiness probe endpoint expose karta hai.
    # [KYU ZAROORI HAI] K8s kubelet container health verify kar sake bina full HTML render kiye.
    # [KAISE CHALTA HAI] Direct HTTP 200 plain text respond karta hai.
    # [OUTPUT / SIDE EFFECT] Healthcheck returns OK.
    # [VARIATIONS TO TRY] Check backend connectivity before returning OK.
    location /healthz {
        # [KYA KARTA HAI] Log noise prevent karne ke liye healthcheck requests ko access log se exclude karta hai.
        # [KYU ZAROORI HAI] Har 5 second aane wale K8s pings se log files bharne se bachata hai.
        # [KAISE CHALTA HAI] Nginx logger ignores this path.
        # [OUTPUT / SIDE EFFECT] Clean access logs.
        # [VARIATIONS TO TRY] Keep error logging enabled.
        access_log off;

        # [KYA KARTA HAI] HTTP 200 status code with "healthy" text return karta hai.
        # [KYU ZAROORI HAI] Instant probe validation with zero disk I/O.
        # [KAISE CHALTA HAI] Returns string directly from memory.
        # [OUTPUT / SIDE EFFECT] 200 OK.
        # [VARIATIONS TO TRY] Return JSON payload `{"status":"UP"}`.
        return 200 "healthy\n";
    }
# [KYA KARTA HAI] Server block scope close karta hai.
# [KYU ZAROORI HAI] Syntax completion.
# [KAISE CHALTA HAI] Closes bracket.
# [OUTPUT / SIDE EFFECT] Configuration compiled.
# [VARIATIONS TO TRY] None.
}
