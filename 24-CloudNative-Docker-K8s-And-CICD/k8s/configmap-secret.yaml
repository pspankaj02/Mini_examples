# ==============================================================================================
# KiranaHub Cloud-Native: Kubernetes ConfigMap & Secret Management
# [KYA KARTA HAI] Non-sensitive configuration aur sensitive credentials ko container images se decouple karta hai (12-Factor App config).
# [KYU ZAROORI HAI] Passwords aur connection strings ko Git me commit hone se rokna aur alag environments me inject karna.
# [KAISE CHALTA HAI] K8s control plane configs ko volume mount ya environment variables ke form me pods me stream karta hai.
# [OUTPUT / SIDE EFFECT] Secure, externalized runtime configurations.
# [VARIATIONS TO TRY] HashiCorp Vault or AWS Secrets Manager CSI driver for automatic secret rotation.
# ==============================================================================================

# [KYA KARTA HAI] Core API version declare karta hai.
# [KYU ZAROORI HAI] ConfigMap standard v1 resource hai.
# [KAISE CHALTA HAI] API server validates ConfigMap schema.
# [OUTPUT / SIDE EFFECT] ConfigMap schema loaded.
# [VARIATIONS TO TRY] None.
apiVersion: v1

# [KYA KARTA HAI] Resource kind ConfigMap define karta hai.
# [KYU ZAROORI HAI] Plain-text application settings store karne ke liye.
# [KAISE CHALTA HAI] Stored as key-value pairs in etcd.
# [OUTPUT / SIDE EFFECT] ConfigMap object created.
# [VARIATIONS TO TRY] ConfigMap generator in Kustomize.
kind: ConfigMap

# [KYA KARTA HAI] Metadata block for ConfigMap.
# [KYU ZAROORI HAI] Resource name aur namespace define karna.
# [KAISE CHALTA HAI] Indexed in namespace.
# [OUTPUT / SIDE EFFECT] Metadata ready.
# [VARIATIONS TO TRY] Custom labels.
metadata:
  # [KYA KARTA HAI] ConfigMap name declare karta hai.
  # [KYU ZAROORI HAI] Deployment env block is name se refer karega.
  # [KAISE CHALTA HAI] Stored as `kiranahub-config`.
  # [OUTPUT / SIDE EFFECT] Name set to kiranahub-config.
  # [VARIATIONS TO TRY] Environment suffix `kiranahub-config-prod`.
  name: kiranahub-config
  # [KYA KARTA HAI] Namespace scope set karta hai.
  # [KYU ZAROORI HAI] Pods ke same namespace me hona mandatory hai.
  # [KAISE CHALTA HAI] Scoped to kiranahub.
  # [OUTPUT / SIDE EFFECT] Namespace mapped.
  # [VARIATIONS TO TRY] Default namespace.
  namespace: kiranahub

# [KYA KARTA HAI] Key-value pairs data block.
# [KYU ZAROORI HAI] Non-sensitive configuration settings store karna.
# [KAISE CHALTA HAI] Values are plain strings injected at pod start.
# [OUTPUT / SIDE EFFECT] Config values mapped.
# [VARIATIONS TO TRY] JSON or YAML file contents inside data.
data:
  # [KYA KARTA HAI] Production ASP.NET hosting environment flag.
  # [KYU ZAROORI HAI] Disables debug diagnostics in production.
  # [KAISE CHALTA HAI] Passed as ASPNETCORE_ENVIRONMENT.
  # [OUTPUT / SIDE EFFECT] Production mode.
  # [VARIATIONS TO TRY] Staging.
  ASPNETCORE_ENVIRONMENT: "Production"
  # [KYA KARTA HAI] Redis cluster service DNS endpoint.
  # [KYU ZAROORI HAI] K8s internal service name se Redis connect karna.
  # [KAISE CHALTA HAI] Injected as REDIS_URL.
  # [OUTPUT / SIDE EFFECT] Internal DNS endpoint.
  # [VARIATIONS TO TRY] Redis sentinel cluster URL.
  REDIS_URL: "kiranahub-redis-svc.kiranahub.svc.cluster.local:6379"
  # [KYA KARTA HAI] RabbitMQ AMQP message broker URL.
  # [KYU ZAROORI HAI] Internal messaging discovery.
  # [KAISE CHALTA HAI] Injected as RABBITMQ_URL.
  # [OUTPUT / SIDE EFFECT] RabbitMQ URI set.
  # [VARIATIONS TO TRY] TLS AMQPS endpoint.
  RABBITMQ_URL: "amqp://kiranahub-rabbitmq-svc.kiranahub.svc.cluster.local:5672/"

---

# [KYA KARTA HAI] Core API version for Secret.
# [KYU ZAROORI HAI] Secret resource schema validation.
# [KAISE CHALTA HAI] Validates Secret v1 spec.
# [OUTPUT / SIDE EFFECT] Secret schema loaded.
# [VARIATIONS TO TRY] None.
apiVersion: v1

# [KYA KARTA HAI] Resource kind Secret declare karta hai.
# [KYU ZAROORI HAI] Encrypted/base64 encoded credentials securely store karne ke liye.
# [KAISE CHALTA HAI] Kubernetes etcd me encrypted at rest store hota hai (agar KMS provider configured ho).
# [OUTPUT / SIDE EFFECT] Secret object created.
# [VARIATIONS TO TRY] SealedSecrets or ExternalSecrets operator.
kind: Secret

# [KYA KARTA HAI] Secret metadata block.
# [KYU ZAROORI HAI] Secret identifier aur namespace assign karna.
# [KAISE CHALTA HAI] Indexed in namespace.
# [OUTPUT / SIDE EFFECT] Secret metadata initialized.
# [VARIATIONS TO TRY] Custom labels.
metadata:
  # [KYA KARTA HAI] Secret name declare karta hai.
  # [KYU ZAROORI HAI] Deployment env secretKeyRef is name se lookup karega.
  # [KAISE CHALTA HAI] Stored as `kiranahub-secrets`.
  # [OUTPUT / SIDE EFFECT] Name set to kiranahub-secrets.
  # [VARIATIONS TO TRY] Environment suffix.
  name: kiranahub-secrets
  # [KYA KARTA HAI] Namespace scope set karta hai.
  # [KYU ZAROORI HAI] Prevents secrets from leaking across namespaces.
  # [KAISE CHALTA HAI] Scoped to kiranahub.
  # [OUTPUT / SIDE EFFECT] Namespace mapped.
  # [VARIATIONS TO TRY] Default namespace.
  namespace: kiranahub

# [KYA KARTA HAI] Secret type define karta hai.
# [KYU ZAROORI HAI] Standard opaque key-value payload declare karna.
# [KAISE CHALTA HAI] K8s treats values as arbitrary byte blobs.
# [OUTPUT / SIDE EFFECT] Opaque secret type.
# [VARIATIONS TO TRY] `kubernetes.io/tls` for certificates.
type: Opaque

# [KYA KARTA HAI] Encrypted or base64 data block.
# [KYU ZAROORI HAI] Database connection strings, API tokens, aur private keys protect karna.
# [KAISE CHALTA HAI] Base64 values decoded into RAM during container environment injection.
# [OUTPUT / SIDE EFFECT] Secure injection to authorized pod memory only.
# [VARIATIONS TO TRY] StringData for plain text automatic base64 encoding.
stringData:
  # [KYA KARTA HAI] PostgreSQL production connection string with credentials.
  # [KYU ZAROORI HAI] EF Core ko relational database se connect karne ke liye credentials provide karna.
  # [KAISE CHALTA HAI] Decoded and passed to container as DB_CONNECTION_STRING.
  # [OUTPUT / SIDE EFFECT] Database access granted securely.
  # [VARIATIONS TO TRY] IAM role-based authentication without static passwords.
  DB_CONNECTION_STRING: "Host=kiranahub-postgres-svc;Database=kiranahub;Username=kirana_admin;Password=SuperSecureProdPassword123!"
